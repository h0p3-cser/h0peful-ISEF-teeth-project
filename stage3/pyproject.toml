[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlf-stage3"
version = "1.2.0"
description = "Endpoint 3: reference-255 QLF and paired original RGB/grayscale stage classification with tooth-level validation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["QLF", "fluorescence", "dental-imaging", "reproducibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "Pillow==11.3.0",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "scikit-image==0.25.2",
    "matplotlib==3.10.6",
    "pandas==2.3.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "joblib==1.5.2",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
atlas = ["pypdf>=5,<8"]

[project.scripts]
qlf-stage3 = "qlf_stage3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qlf_stage3 = ["config/*.json", "config/*.csv", "config/*.md"]
