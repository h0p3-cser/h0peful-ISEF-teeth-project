name: Test reproducibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  packaged-pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux report fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install CPU encoder dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0 torchvision==0.24.0
      - name: Build and install the distribution
        run: |
          python -m pip install build
          python tools/release.py
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist/*.whl')])"
          python -m pip check
      - name: Test measurements and grouping
        run: python -m unittest discover -s tests -v
      - name: Replay the whole synthetic study
        run: |
          qlf-stage3 demo-data --out data/demo
          qlf-stage3 check-data --data data/demo
          qlf-stage3 endpoint --data data/demo --out runs/demo
          qlf-stage3 verify --run runs/demo
          python tests/check_endpoint.py --run runs/demo --data data/demo
